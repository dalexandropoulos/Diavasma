<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Elegant Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252a33" />
      <stop offset="100%" stop-color="#14171d" />
    </linearGradient>

    <!-- Warm Golden Amber Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2a15c" />
      <stop offset="50%" stop-color="#d48b3b" />
      <stop offset="100%" stop-color="#b66d25" />
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf6ee" />
      <stop offset="100%" stop-color="#ede3d1" />
    </linearGradient>

    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="deltaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Solid / Rounded Background (Safe for Maskable full-bleed) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Ambient Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#amberGrad)" opacity="0.06" />

  <!-- Safe Area Main Illustration Group (centered in [75..437], safe radius 195) -->
  <g id="artwork">
    <!-- Open Book Silhouette (Clear, high contrast paper pages) -->
    <g filter="url(#bookShadow)">
      <!-- Left Page -->
      <path d="M 256 372 C 210 352, 140 354, 88 376 L 88 190 C 140 168, 210 166, 256 186 Z"
            fill="url(#paperGrad)" />
      <!-- Right Page -->
      <path d="M 256 372 C 302 352, 372 354, 424 376 L 424 190 C 372 168, 302 166, 256 186 Z"
            fill="url(#paperGrad)" />
      <!-- Book Spine & Center Binding -->
      <path d="M 256 186 L 256 372" stroke="#d5c7b3" stroke-width="3" stroke-linecap="round" />
      <!-- Page Text Whispers (Subtle lines on pages) -->
      <line x1="120" y1="225" x2="225" y2="218" stroke="#cab89f" stroke-width="3.5" stroke-linecap="round" opacity="0.55" />
      <line x1="120" y1="255" x2="225" y2="248" stroke="#cab89f" stroke-width="3.5" stroke-linecap="round" opacity="0.55" />
      <line x1="120" y1="285" x2="200" y2="279" stroke="#cab89f" stroke-width="3.5" stroke-linecap="round" opacity="0.55" />

      <line x1="287" y1="218" x2="392" y2="225" stroke="#cab89f" stroke-width="3.5" stroke-linecap="round" opacity="0.55" />
      <line x1="287" y1="248" x2="392" y2="255" stroke="#cab89f" stroke-width="3.5" stroke-linecap="round" opacity="0.55" />
      <line x1="287" y1="279" x2="367" y2="285" stroke="#cab89f" stroke-width="3.5" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- Prominent Greek Delta (Δ) Glyph -->
    <g filter="url(#deltaShadow)">
      <text x="256" y="348"
            font-family="'Literata', 'Cinzel', Georgia, serif"
            font-size="210"
            font-weight="800"
            fill="url(#amberGrad)"
            text-anchor="middle"
            letter-spacing="-2px">Δ</text>
    </g>
  </g>
</svg>
